# STUDENT CONTEXT: S1-S2 | containerised Nginx proxy, API on the laptop
# TO PREPARE / ADAPT: Start Uvicorn on 0.0.0.0:8000 before the browser acceptance.
# EXPECTED CHECK: Open port 8080 and check a request forwarded to the local API.
#
# S1-S2: configuration mounted read-only by compose.dev.yaml.
# Never use this laptop host name for the Kubernetes deployment.
server {
    listen 8080;
    # Same limit as in production to test CSV uploads from S2 onwards.
    client_max_body_size 2m;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    # The proxy runs in a container, but Uvicorn runs on the laptop in S1-S2.
    # extra_hosts in compose.dev.yaml provides this name on Linux.
    location /api/ { proxy_pass http://host.docker.internal:8000; }
    location /health/ { proxy_pass http://host.docker.internal:8000; }
}
