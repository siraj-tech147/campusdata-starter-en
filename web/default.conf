# STUDENT CONTEXT: S3-S6 | Nginx in Compose or Kubernetes
# TO PREPARE / ADAPT: Keep api:8000 and the contract prefixes; use dev.conf only in S1-S2.
# EXPECTED CHECK: Test /, /api/version and a business request from the web entry point.
#
# S3-S6: configuration embedded in the web image.
# The names api/db are only resolved on the appropriate internal network.
# Nginx resolves the name api at start-up and keeps the address obtained. With Compose,
# recreating only the API may change its IP: also restart web if a 502
# appears. With Kubernetes, the address of the api Service stays stable.
server {
    # Unprivileged port, consistent with the Dockerfile, Compose and the web Service.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # CSV uploads: Nginx accepts up to 2 MB so that the API itself refuses
    # beyond 1 MiB with a readable JSON 413, rather than an Nginx error page.
    client_max_body_size 2m;
    # A missing static path stays a 404; no fake index.html in response.
    location / { try_files $uri $uri/ =404; }
    # Same origin for the browser: the client calls /api/datasets, not api:8000.
    location /api/ {
        # No trailing path slash: keep /api/ in the forwarded request.
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Timeout to connect to the API, distinct from the timeout to read its response.
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    # Expose the probes through the same entry point for the acceptance tests.
    # A 502 from the proxy is different from a 503 returned by FastAPI.
    location /health/ {
        proxy_pass http://api:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
