# STUDENT CONTEXT: S1-S2 | run from the root of the student repository
# TO PREPARE / ADAPT: Generate .env; keep the database port reachable only on the loopback.
# EXPECTED CHECK: Local API pointing to campus; separate test terminal pointing to campus_test.
#
# S1-S2 only: containerised database and reverse proxy, API run on the laptop.
name: campusdata-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    # The API runs on the laptop: database access through 127.0.0.1:5432, not through db.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Development volume, separate from pgdata in the S3 stack.
      # Data is not transferred automatically between these volumes.
      - devpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    image: nginxinc/nginx-unprivileged:stable-alpine
    # Laptop 127.0.0.1:8080 -> Nginx :8080; Nginx forwards /api to Uvicorn :8000 on the laptop.
    ports:
      - "127.0.0.1:8080:8080"
    # Link the name host.docker.internal to the laptop gateway on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Read-only bind mounts: local changes are visible
      # without rebuilding the image; the laptop's Unix permissions still apply.
      - ./web:/usr/share/nginx/html:ro
      - ./web/dev.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  devpgdata:
